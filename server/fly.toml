# fly.io config for the ReadLater sync server.
# Deploy from this directory:  fly deploy --ha=false
app = 'readlater-mbent'
primary_region = 'sjc'

[env]
  # Email-to-save: the server polls this mailbox over IMAP and saves each
  # forwarded message as an article. The password lives in a Fly secret
  # (READLATER_IMAP_PASS), never here.
  READLATER_IMAP_HOST = 'mail.doc-ent.com'
  READLATER_IMAP_USER = 'read@doc-ent.com'
  # Not a mail setting: the Earmark username whose library forwarded mail
  # lands in (as typed on the login page).
  READLATER_IMAP_SAVE_TO_EARMARK_USER = 'michael'
  READLATER_IMAP_ALLOW_FROM = 'bentley.michael.j@gmail.com'
  READLATER_IMAP_INTERVAL = '120'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # On 2026-08-14 the process stayed alive but stopped serving for several
  # minutes — the proxy logged "could not finish reading HTTP body from
  # instance" and saves hung with no error. Nothing noticed, because nothing
  # was watching: extraction and SQLite are synchronous, so one heavy article
  # blocks every other request, and a blocked event loop still looks 'started'
  # to flyd. This check makes the stall visible and fails requests fast rather
  # than letting them hang. /login is the one route that answers 200 without a
  # session (everything else 303s to it), and it touches the DB, so a check
  # that passes means the whole request path is really moving.
  [[http_service.checks]]
    interval = '15s'
    timeout = '4s'
    grace_period = '20s'
    method = 'GET'
    path = '/login'

[[mounts]]
  source = 'readlater_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
